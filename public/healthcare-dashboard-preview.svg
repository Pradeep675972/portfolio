<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Healthcare Dashboard patient view</title>
  <desc id="desc">Healthcare dashboard showing Jessica Taylor patient vitals, blood pressure history, diagnostics, and lab results.</desc>
  <rect width="1200" height="700" fill="#eef3f6"/>
  <rect x="0" y="0" width="236" height="700" fill="#ffffff"/>
  <rect x="34" y="30" width="166" height="30" rx="6" fill="#1d7fb4"/>
  <text x="62" y="51" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">CareView</text>
  <text x="36" y="112" fill="#6a7d8a" font-family="Arial, sans-serif" font-size="13">PATIENTS</text>
  <rect x="24" y="132" width="188" height="54" rx="8" fill="#e1f0f7"/>
  <circle cx="52" cy="159" r="15" fill="#f0a78c"/><text x="78" y="164" fill="#18384b" font-family="Arial, sans-serif" font-size="14" font-weight="700">Jessica Taylor</text>
  <text x="36" y="225" fill="#6a7d8a" font-family="Arial, sans-serif" font-size="13">DASHBOARD</text>
